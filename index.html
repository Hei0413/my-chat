<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>專屬跨裝置私密通訊室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overscroll-behavior-y: none;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .recording-pulse {
      animation: pulse-ring 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

  <!-- 登入畫面 -->
  <div id="login-screen" class="flex-1 flex flex-col items-center justify-center p-6 bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white">
    <div class="bg-white/95 backdrop-blur-md text-slate-800 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
      <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-inner">
        <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold mb-2">跨裝置私密通訊室</h1>
      <p class="text-sm text-slate-500 mb-6">支援 iPad 與手機同步登入、憑房間 ID 進入私密聊天室、保存對話、相片、檔案與語音。</p>

      <button id="btn-google-login" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 active:scale-[0.98] text-slate-700 font-semibold py-3.5 px-4 rounded-xl shadow-sm transition-all">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
        </svg>
        <span>使用 Google 帳號登入</span>
      </button>
      <p id="login-error" class="text-xs text-red-500 mt-4 hidden"></p>
    </div>
  </div>

  <!-- 主聊天室畫面 -->
  <div id="chat-screen" class="hidden flex-1 flex flex-col h-full max-w-4xl w-full mx-auto bg-white shadow-xl">
    
    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 px-3 sm:px-4 py-2.5 flex items-center justify-between shrink-0 z-10 gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold shadow-sm shrink-0">
          聊
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <select id="room-select" class="text-xs sm:text-sm bg-slate-100 border border-slate-200 rounded-lg px-2 py-1 font-semibold text-indigo-700 focus:outline-none max-w-[150px] sm:max-w-[220px] truncate">
            </select>
            <button id="btn-new-room" title="建立私密聊天室" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-1 rounded-lg font-medium transition-colors shrink-0">
              + 建立
            </button>
            <button id="btn-join-room" title="輸入房間 ID 加入" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-2 py-1 rounded-lg font-medium transition-colors shrink-0">
              🔑 加入
            </button>
          </div>
          <!-- 顯示目前房間 ID 方便分享 -->
          <div id="room-id-bar" class="hidden flex items-center gap-1.5 mt-1">
            <span class="text-[11px] text-slate-500">房間 ID：<strong id="current-room-id-text" class="text-slate-700 font-mono select-all"></strong></span>
            <button id="btn-copy-room-id" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded border border-slate-200">
              複製 ID
            </button>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <div class="hidden sm:flex items-center gap-2 text-right">
          <div>
            <p id="user-name" class="text-xs font-semibold text-slate-700"></p>
            <p id="user-email" class="text-[11px] text-slate-400"></p>
          </div>
          <img id="user-avatar" src="" alt="頭像" class="w-8 h-8 rounded-full border border-slate-200 object-cover" />
        </div>
        <button id="btn-logout" class="text-xs bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-600 px-2.5 py-1.5 rounded-lg font-medium transition-colors">
          登出
        </button>
      </div>
    </header>

    <!-- 訊息顯示區 -->
    <main id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
      <div id="loading-messages" class="text-center text-sm text-slate-400 py-10">
        正在載入雲端對話紀錄...
      </div>
    </main>

    <!-- 上傳進度條 -->
    <div id="upload-progress-bar" class="hidden bg-indigo-50 px-4 py-2 border-t border-indigo-100 flex items-center justify-between text-xs text-indigo-700">
      <span id="upload-status-text">正在上傳檔案至雲端...</span>
      <span id="upload-percent" class="font-bold">0%</span>
    </div>

    <!-- 錄音中提示列 -->
    <div id="recording-bar" class="hidden bg-red-50 px-4 py-3 border-t border-red-200 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="w-3 h-3 rounded-full bg-red-500 recording-pulse"></span>
        <span class="text-sm font-medium text-red-700">正在錄音... <span id="recording-timer">00:00</span></span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-cancel-record" class="px-3 py-1 text-xs bg-white border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-100">取消</button>
        <button id="btn-send-record" class="px-3 py-1 text-xs bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 shadow-sm">傳送錄音</button>
      </div>
    </div>

    <!-- 底部輸入列 -->
    <footer id="input-footer" class="bg-white border-t border-slate-200 p-3 shrink-0">
      <div class="flex items-end gap-2">
        <input type="file" id="file-input-image" accept="image/*" class="hidden" />
        <input type="file" id="file-input-doc" class="hidden" />

        <button id="btn-upload-image" title="傳送相片" class="p-2.5 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </button>

        <button id="btn-upload-doc" title="傳送檔案" class="p-2.5 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
          </svg>
        </button>

        <textarea id="message-input" rows="1" placeholder="輸入訊息..." class="flex-1 bg-slate-100 border-0 rounded-2xl px-4 py-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:bg-white resize-none max-h-32 overflow-y-auto"></textarea>

        <button id="btn-start-record" title="錄製語音" class="p-2.5 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition-colors shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
          </svg>
        </button>

        <button id="btn-send-text" class="p-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl shadow-sm transition-all shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Firebase SDK (模組化 v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, setDoc, getDoc, doc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    const USER_FIREBASE_CONFIG = {
      apiKey: "AIzaSyAoYsdEoFAX4W1_pBsEv0bNXX1xnnamiI0",
      authDomain: "my-chat-web-2990a.firebaseapp.com",
      projectId: "my-chat-web-2990a",
      storageBucket: "my-chat-web-2990a.firebasestorage.app",
      messagingSenderId: "386412063732",
      appId: "1:386412063732:web:b3f9ddcedbddb0cf4027a1",
      measurementId: "G-N01QH5DPDJ"
    };

    const app = initializeApp(USER_FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const provider = new GoogleAuthProvider();

    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const btnGoogleLogin = document.getElementById('btn-google-login');
    const btnLogout = document.getElementById('btn-logout');
    const loginError = document.getElementById('login-error');
    const roomSelect = document.getElementById('room-select');
    const btnNewRoom = document.getElementById('btn-new-room');
    const btnJoinRoom = document.getElementById('btn-join-room');
    const roomIdBar = document.getElementById('room-id-bar');
    const currentRoomIdText = document.getElementById('current-room-id-text');
    const btnCopyRoomId = document.getElementById('btn-copy-room-id');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const btnSendText = document.getElementById('btn-send-text');
    const btnUploadImage = document.getElementById('btn-upload-image');
    const btnUploadDoc = document.getElementById('btn-upload-doc');
    const fileInputImage = document.getElementById('file-input-image');
    const fileInputDoc = document.getElementById('file-input-doc');
    const uploadProgressBar = document.getElementById('upload-progress-bar');
    const uploadStatusText = document.getElementById('upload-status-text');
    const uploadPercent = document.getElementById('upload-percent');

    const btnStartRecord = document.getElementById('btn-start-record');
    const recordingBar = document.getElementById('recording-bar');
    const inputFooter = document.getElementById('input-footer');
    const recordingTimer = document.getElementById('recording-timer');
    const btnCancelRecord = document.getElementById('btn-cancel-record');
    const btnSendRecord = document.getElementById('btn-send-record');

    let currentUser = null;
    let unsubscribeMessages = null;
    let unsubscribeMyRooms = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordInterval = null;
    let recordSeconds = 0;

    // 產生 6 碼大寫英數字房間 ID
    function generateRoomId() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let result = '';
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    // Google 登入
    btnGoogleLogin.addEventListener('click', async () => {
      loginError.classList.add('hidden');
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        loginError.textContent = "登入失敗：" + error.message;
        loginError.classList.remove('hidden');
      }
    });

    btnLogout.addEventListener('click', () => signOut(auth));

    // 監聽登入狀態
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('user-name').textContent = user.displayName || "使用者";
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-avatar').src = user.photoURL || "https://ui-avatars.com/api/?name=" + encodeURIComponent(user.displayName || "U");
        
        loginScreen.classList.add('hidden');
        chatScreen.classList.remove('hidden');
        loadMyJoinedRooms();
      } else {
        currentUser = null;
        if (unsubscribeMessages) unsubscribeMessages();
        if (unsubscribeMyRooms) unsubscribeMyRooms();
        chatScreen.classList.add('hidden');
        loginScreen.classList.remove('hidden');
      }
    });

    // 只載入「我自己建立或加入過」的聊天室清單（跨裝置同步，其他人看不到）
    function loadMyJoinedRooms() {
      if (unsubscribeMyRooms) unsubscribeMyRooms();
      const myRoomsQuery = query(collection(db, "users", currentUser.uid, "joined_rooms"), orderBy("joinedAt", "asc"));

      unsubscribeMyRooms = onSnapshot(myRoomsQuery, (snapshot) => {
        const previousSelected = roomSelect.value;
        const personalId = `personal_${currentUser.uid}`;

        roomSelect.innerHTML = `
          <option value="${personalId}">📝 我的私人筆記 (僅自己)</option>
        `;

        snapshot.forEach((docSnap) => {
          const roomData = docSnap.data();
          const opt = document.createElement('option');
          opt.value = docSnap.id;
          opt.textContent = `🔒 ${roomData.name}`;
          roomSelect.appendChild(opt);
        });

        // 恢復選取或預設選第一個私密房間
        if (previousSelected && [...roomSelect.options].some(o => o.value === previousSelected)) {
          roomSelect.value = previousSelected;
        } else if (!snapshot.empty) {
          roomSelect.value = snapshot.docs[snapshot.docs.length - 1].id;
        } else {
          roomSelect.value = personalId;
        }

        updateRoomIdDisplay();
        loadMessages();
      });
    }

    // 更新頂部的房間 ID 顯示欄
    function updateRoomIdDisplay() {
      const selectedId = roomSelect.value;
      if (selectedId && !selectedId.startsWith('personal_')) {
        currentRoomIdText.textContent = selectedId;
        roomIdBar.classList.remove('hidden');
      } else {
        roomIdBar.classList.add('hidden');
      }
    }

    // 複製房間 ID 按鈕
    btnCopyRoomId.addEventListener('click', () => {
      const idText = currentRoomIdText.textContent;
      if (idText) {
        navigator.clipboard.writeText(idText);
        btnCopyRoomId.textContent = "已複製！";
        setTimeout(() => { btnCopyRoomId.textContent = "複製 ID"; }, 1500);
      }
    });

    // 1. 建立私密聊天室
    btnNewRoom.addEventListener('click', async () => {
      const roomName = prompt("請輸入新聊天室的名稱（例如：我和XX的秘密基地）：");
      if (!roomName || !roomName.trim()) return;

      const cleanName = roomName.trim();
      const newRoomId = generateRoomId();

      try {
        // 在系統建立房間資料
        await setDoc(doc(db, "private_rooms", newRoomId), {
          name: cleanName,
          createdBy: currentUser.uid,
          createdAt: serverTimestamp()
        });

        // 將此房間加入自己的清單（iPad 與手機同步）
        await setDoc(doc(db, "users", currentUser.uid, "joined_rooms", newRoomId), {
          name: cleanName,
          joinedAt: serverTimestamp()
        });

        roomSelect.value = newRoomId;
        updateRoomIdDisplay();
        loadMessages();
        alert(`聊天室「${cleanName}」已建立！\n\n專屬房間 ID 為：${newRoomId}\n請把這組 ID 傳給你的朋友，他輸入 ID 後就能進來！`);
      } catch (error) {
        alert("建立失敗：" + error.message);
      }
    });

    // 2. 輸入房間 ID 加入朋友的聊天室
    btnJoinRoom.addEventListener('click', async () => {
      const inputId = prompt("請輸入朋友給你的 6 碼房間 ID：");
      if (!inputId || !inputId.trim()) return;

      const cleanId = inputId.trim().toUpperCase();

      try {
        const roomRef = doc(db, "private_rooms", cleanId);
        const roomSnap = await getDoc(roomRef);

        if (!roomSnap.exists()) {
          alert("找不到這個房間 ID，請確認是否輸入正確！");
          return;
        }

        const roomData = roomSnap.data();
        // 儲存到自己的已加入清單中，之後開啟網頁直接切換即可
        await setDoc(doc(db, "users", currentUser.uid, "joined_rooms", cleanId), {
          name: roomData.name,
          joinedAt: serverTimestamp()
        });

        roomSelect.value = cleanId;
        updateRoomIdDisplay();
        loadMessages();
      } catch (error) {
        alert("加入失敗：" + error.message);
      }
    });

    // 切換聊天室
    roomSelect.addEventListener('change', () => {
      if (currentUser) {
        updateRoomIdDisplay();
        loadMessages();
      }
    });

    // 載入訊息
    function loadMessages() {
      if (unsubscribeMessages) unsubscribeMessages();
      messagesContainer.innerHTML = '<div class="text-center text-sm text-slate-400 py-10">正在載入對話紀錄...</div>';

      const roomId = roomSelect.value;
      const messagesRef = collection(db, "rooms", roomId, "messages");
      const q = query(messagesRef, orderBy("createdAt", "asc"));

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        messagesContainer.innerHTML = '';
        if (snapshot.empty) {
          messagesContainer.innerHTML = '<div class="text-center text-sm text-slate-400 py-10">這個聊天室還沒有訊息，傳送第一句話開始吧！</div>';
          return;
        }

        snapshot.forEach((docSnap) => {
          renderMessage(docSnap.data());
        });

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }, (error) => {
        messagesContainer.innerHTML = `<div class="text-center text-xs text-red-500 py-6 px-4">讀取失敗：${error.message}</div>`;
      });
    }

    // 渲染單則訊息
    function renderMessage(data) {
      const isMine = data.uid === currentUser.uid;
      const wrapper = document.createElement('div');
      wrapper.className = `flex gap-2.5 ${isMine ? 'flex-row-reverse' : 'flex-row'}`;

      const avatarUrl = data.photoURL || "https://ui-avatars.com/api/?name=" + encodeURIComponent(data.displayName || "U");
      const timeStr = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '傳送中...';

      let contentHtml = '';
      if (data.type === 'text') {
        contentHtml = `<p class="whitespace-pre-wrap break-words text-sm leading-relaxed">${escapeHtml(data.text)}</p>`;
      } else if (data.type === 'image') {
        contentHtml = `
          <a href="${data.fileUrl}" target="_blank" rel="noopener noreferrer">
            <img src="${data.fileUrl}" alt="相片" class="max-w-[240px] sm:max-w-xs rounded-xl border border-black/10 object-cover cursor-pointer hover:opacity-95" />
          </a>`;
      } else if (data.type === 'audio') {
        contentHtml = `
          <div class="flex items-center gap-2 min-w-[200px]">
            <audio controls src="${data.fileUrl}" class="h-9 w-56 max-w-full"></audio>
          </div>`;
      } else if (data.type === 'file') {
        contentHtml = `
          <a href="${data.fileUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 p-2 rounded-lg ${isMine ? 'bg-indigo-700/50 hover:bg-indigo-700' : 'bg-slate-100 hover:bg-slate-200'} transition-colors">
            <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
            <div class="overflow-hidden">
              <p class="text-xs font-medium truncate max-w-[180px]">${escapeHtml(data.fileName || '下載檔案')}</p>
              <p class="text-[10px] opacity-75">點擊開啟 / 下載</p>
            </div>
          </a>`;
      }

      wrapper.innerHTML = `
        <img src="${avatarUrl}" alt="頭像" class="w-8 h-8 rounded-full object-cover shrink-0 mt-1 border border-slate-200" />
        <div class="flex flex-col ${isMine ? 'items-end' : 'items-start'} max-w-[78%]">
          <span class="text-[11px] text-slate-400 mb-1 px-1">${escapeHtml(data.displayName || '使用者')}</span>
          <div class="px-3.5 py-2.5 rounded-2xl shadow-sm ${isMine ? 'bg-indigo-600 text-white rounded-tr-sm' : 'bg-white text-slate-800 border border-slate-200 rounded-tl-sm'}">
            ${contentHtml}
          </div>
          <span class="text-[10px] text-slate-400 mt-1 px-1">${timeStr}</span>
        </div>
      `;

      messagesContainer.appendChild(wrapper);
    }

    // 傳送文字訊息
    async function sendTextMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentUser) return;

      messageInput.value = '';
      messageInput.style.height = 'auto';

      const roomId = roomSelect.value;
      const messagesRef = collection(db, "rooms", roomId, "messages");

      try {
        await addDoc(messagesRef, {
          uid: currentUser.uid,
          displayName: currentUser.displayName,
          photoURL: currentUser.photoURL,
          type: 'text',
          text: text,
          createdAt: serverTimestamp()
        });
      } catch (error) {
        alert("傳送失敗：" + error.message);
      }
    }

    btnSendText.addEventListener('click', sendTextMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendTextMessage();
      }
    });
    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    // 上傳檔案 / 相片 / 錄音
    function uploadFileAndSend(file, msgType, customFileName) {
      if (!file || !currentUser) return;

      const roomId = roomSelect.value;
      const safeName = customFileName || file.name || `file_${Date.now()}`;
      const storagePath = `chat_uploads/${roomId}/${Date.now()}_${safeName}`;
      const storageRef = ref(storage, storagePath);

      uploadProgressBar.classList.remove('hidden');
      uploadStatusText.textContent = `正在上傳：${safeName}`;
      uploadPercent.textContent = '0%';

      const uploadTask = uploadBytesResumable(storageRef, file);

      uploadTask.on('state_changed',
        (snapshot) => {
          const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
          uploadPercent.textContent = `${progress}%`;
        },
        (error) => {
          uploadProgressBar.classList.add('hidden');
          alert("上傳失敗：" + error.message + "（請確認已在 Firebase 後台啟用 Storage）");
        },
        async () => {
          const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
          const messagesRef = collection(db, "rooms", roomId, "messages");
          await addDoc(messagesRef, {
            uid: currentUser.uid,
            displayName: currentUser.displayName,
            photoURL: currentUser.photoURL,
            type: msgType,
            fileUrl: downloadURL,
            fileName: safeName,
            createdAt: serverTimestamp()
          });
          uploadProgressBar.classList.add('hidden');
        }
      );
    }

    btnUploadImage.addEventListener('click', () => fileInputImage.click());
    fileInputImage.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        uploadFileAndSend(e.target.files[0], 'image');
        e.target.value = '';
      }
    });

    btnUploadDoc.addEventListener('click', () => fileInputDoc.click());
    fileInputDoc.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        uploadFileAndSend(e.target.files[0], 'file');
        e.target.value = '';
      }
    });

    // 語音錄製功能
    btnStartRecord.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.start();
        inputFooter.classList.add('hidden');
        recordingBar.classList.remove('hidden');

        recordSeconds = 0;
        recordingTimer.textContent = "00:00";
        recordInterval = setInterval(() => {
          recordSeconds++;
          const mins = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
          const secs = String(recordSeconds % 60).padStart(2, '0');
          recordingTimer.textContent = `${mins}:${secs}`;
        }, 1000);
      } catch (err) {
        alert("無法啟動麥克風，請確認瀏覽器已允許麥克風權限。");
      }
    });

    function stopRecordingStream() {
      clearInterval(recordInterval);
      if (mediaRecorder && mediaRecorder.stream) {
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
      recordingBar.classList.add('hidden');
      inputFooter.classList.remove('hidden');
    }

    btnCancelRecord.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.onstop = null;
        mediaRecorder.stop();
      }
      stopRecordingStream();
    });

    btnSendRecord.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.onstop = () => {
          const mimeType = mediaRecorder.mimeType || 'audio/mp4';
          const ext = mimeType.includes('webm') ? 'webm' : 'm4a';
          const audioBlob = new Blob(audioChunks, { type: mimeType });
          uploadFileAndSend(audioBlob, 'audio', `voice_${Date.now()}.${ext}`);
        };
        mediaRecorder.stop();
      }
      stopRecordingStream();
    });

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
</html>
